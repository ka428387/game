<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3ヒントクイズ｜あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<script src="common/asobi.js"></script>
<style>
:root {
  --paper: #FBF8F2; --wood: #B8845A; --wood-dk: #8A5E38;
  --ink: #3A2A1A; --ink-lt: #7A6050;
  --correct: #4E9E72; --wrong: #C94040; --shadow: rgba(60,30,10,.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f6f1e4; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden; padding-bottom: 32px;
}
header { width: 100%; padding: 58px 16px 2px; text-align: center; }
.app-title {
  font-size: 24px; font-weight: 900; letter-spacing: .06em; color: var(--ink);
  text-shadow: 0 2px 0 #fff, 0 0 10px rgba(255,255,255,.9);
}
.q-count {
  display: inline-block; margin: 8px auto 6px; padding: 5px 16px; border-radius: 12px;
  background: var(--paper); box-shadow: 0 2px 8px var(--shadow);
  font-size: .95rem; font-weight: 700; color: var(--ink);
}
.q-count b { color: var(--wood-dk); }

.q-card {
  width: calc(100% - 32px); max-width: 440px;
  background: var(--paper); border-radius: 22px; padding: 18px 16px 16px;
  box-shadow: 0 4px 16px var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.q-text { font-size: 1.1rem; font-weight: 900; color: var(--ink); }
/* くり返しの文字：ひとかたまりずつ、折り返しても見やすく */
.hints { width: 100%; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.hrow { display: flex; gap: 8px; align-items: flex-start; background: #fff; border-radius: 12px; padding: 6px 10px; min-height: 50px; visibility: hidden; }
.hrow.on { visibility: visible; }
.hrow.new { animation: fadeIn .25s ease; }
.hrow b { flex: none; font-size: .8rem; color: #fff; background: var(--wood); border-radius: 10px; padding: 2px 8px; margin-top: 2px; }
.hrow span { font-size: .95rem; font-weight: 700; color: var(--ink); line-height: 1.5; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.slots { display: flex; justify-content: center; gap: 6px; min-height: 64px; width: 100%; }
.slot {
  flex: 0 1 54px; min-width: 0; height: 56px; border-radius: 14px; border: 3px dashed var(--wood);
  background: #fff; font-size: 1.7rem; font-weight: 900; color: var(--ink);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.slot.filled { border-style: solid; }
.slots.ng { animation: shake .4s ease; }
.slots.ok .slot { border-color: var(--correct); background: #EEF8F2; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
#play { width: 100%; display: flex; flex-direction: column; align-items: center; }
.q-nan { font-size: 1.5rem; font-weight: 900; color: var(--ink); }

.hint-btn {
  background: none; border: 2px solid var(--wood); border-radius: 20px; padding: 5px 18px;
  font-size: .78rem; font-weight: 700; color: var(--wood); cursor: pointer;
}
.hint-btn:active { background: var(--wood); color: var(--paper); }
.tools { display: flex; gap: 10px; }
.hint-btn:disabled { opacity: .35; }
.hint-btn[hidden] { display: inline-block; visibility: hidden; }
.bubble {
  width: calc(100% - 32px); max-width: 440px; margin-top: 6px; min-height: 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  visibility: hidden;
  font-size: .85rem; font-weight: 700; color: var(--ink-lt);
  background: rgba(184,132,90,.1); border-radius: 12px; padding: 8px 14px;
  text-align: center; line-height: 1.6;
}
.bubble.show { visibility: visible; }
.bubble.good { color: #2f6e4b; background: #EEF8F2; font-size: 1rem; }
.bubble .em { font-size: 2rem; display: block; line-height: 1.2; }

.choices {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  width: calc(100% - 32px); max-width: 440px;
}
.choice {
  background: var(--paper); border: 2.5px solid transparent; border-radius: 16px;
  padding: 0; height: 56px; font-size: 1.8rem; font-weight: 900; color: var(--ink);
  box-shadow: 0 4px 0 rgba(0,0,0,.09), 0 2px 8px var(--shadow); cursor: pointer;
}
.choice:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.choice.used { opacity: .25; }
.choice:disabled { cursor: default; }

.next-btn, .again-btn {
  margin-top: 8px; padding: 12px 40px; border: none; border-radius: 50px;
  background: var(--wood); color: #fff; font-size: 1.1rem; font-weight: 900;
  box-shadow: 0 4px 0 var(--wood-dk); cursor: pointer;
}
.next-btn:active, .again-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dk); }
.next-btn[hidden] { display: inline-block; visibility: hidden; }
.end { display: none; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 28px 16px; }
.end.show { display: flex; }
.end .big { font-size: 3.4rem; }
.end h2 { font-size: 1.5rem; font-weight: 900; color: var(--ink); }
.end p { font-size: 1.1rem; font-weight: 700; color: var(--ink-lt); }
.end-btn {
  display: inline-block; margin-top: 10px; padding: 12px 36px; border-radius: 50px;
  border: 2px solid var(--wood); background: var(--paper); color: var(--wood-dk);
  font-size: 1rem; font-weight: 900; text-decoration: none;
}
body::before { background-image: url('images/bg/nakama.jpg'); }
</style>
</head>
<body data-asobi="game">

<header>
  <h1 class="app-title">💡 3ヒントクイズ</h1>
  <div class="q-count" id="qCount">もんだい <b id="qNum">1</b>/<span id="qTotal">5</span></div>
</header>

<div id="play">
  <div class="q-card">
    
    <div class="hints" id="hints"></div>
    <div class="slots" id="slots"></div>
    <div class="tools"><button class="hint-btn" id="hintBtn" type="button">💡 つぎの ヒント</button><button class="hint-btn" id="delBtn" type="button">⌫ けす</button></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="bubble" id="bubble"></div>
</div>
<div style="display:flex;justify-content:center"><button class="next-btn" id="nextBtn" type="button" hidden>つぎへ</button></div>

<div class="end" id="end">
  <div class="big">🎉</div>
  <h2>おしまい！</h2>
  <p id="endText"></p>
  <button class="again-btn" type="button" id="againBtn">もっと あそぶ</button>
  <a class="end-btn" href="index.html">おしまい</a>
</div>

<script>
// 3つの ヒントを 1つずつ ふやして あてる クイズ。ヒントが すくないほど こうとくてん（3・2・1てん）。こたえは ひらがなカードを ならべて つくる。
// ans：こたえ、hints：ヒント3つ（1つめは ひろく、3つめで ほぼ きまる）
const QUIZ = [
  { ans: 'ぞう', emoji: '🐘', hints: ['どうぶつえんで みられるよ', 'からだが とても おおきくて はいいろだよ', 'はなが ながくて はなで みずを すえるよ'] },
  { ans: 'きりん', emoji: '🦒', hints: ['きいろに ちゃいろの もようが あるよ', 'あしが ながくて、き の たかい ところの はっぱを たべるよ', 'くびが とても とても ながいよ'] },
  { ans: 'ぺんぎん', emoji: '🐧', hints: ['とりの なかまだよ', 'そらは とべないけど、うみで およぐのが じょうずだよ', 'しろと くろの からだで、こおりの うえを よちよち あるくよ'] },
  { ans: 'かめ', emoji: '🐢', hints: ['うみや かわ、いけに すんでいるよ', 'あるくのが とても ゆっくりだよ', 'せなかに かたい こうらが あって、あたまを ひっこめられるよ'] },
  { ans: 'しまうま', emoji: '🦓', hints: ['アフリカの くさはらに すんでいるよ', 'うまに よく にているよ', 'からだじゅう しろと くろの しましまだよ'] },
  { ans: 'こあら', emoji: '🐨', hints: ['オーストラリアに すんでいるよ', 'きに つかまって、1にちの ほとんどを ねて すごすよ', 'ユーカリの はっぱが だいすきで、はいいろの ふわふわの けだよ'] },
  { ans: 'ふくろう', emoji: '🦉', hints: ['とりの なかまだよ', 'よるに おきて、ひるまは ねているよ', 'くびが ぐるっと うしろまで まわって、「ほー ほー」と なくよ'] },
  { ans: 'らっこ', emoji: '🦦', hints: ['うみに すんでいるよ', 'あおむけに なって、みずに ぷかぷか うかんでいるよ', 'おなかの うえで いしを つかって、かいを わって たべるよ'] },
  { ans: 'かめれおん', emoji: '🦎', hints: ['あしが 4ほん あって、むしを たべるよ', 'めが みぎと ひだりで べつべつに うごくよ', 'からだの いろを まわりに あわせて かえられるよ'] },
  { ans: 'ばなな', emoji: '🍌', hints: ['くだものだよ', 'きいろい かわを てで むいて たべるよ', 'ほそながく まがった かたちで、おさるさんの だいこうぶつだよ'] },
  { ans: 'おにぎり', emoji: '🍙', hints: ['ごはんで つくる たべものだよ', 'てで ぎゅっと にぎって かたちを つくるよ', 'さんかくの かたちが おおくて、のりを まいて たべるよ'] },
  { ans: 'しょうぼうしゃ', emoji: '🚒', hints: ['くるまの なかまだよ', 'からだが まっかで、うーうーと おおきな おとを ならして はしるよ', 'かじの ときに かけつけて、みずを かけて ひを けすよ'] },
  { ans: 'ひこうき', emoji: '✈️', hints: ['ひとが のる のりものだよ', 'そらを とぶよ', 'おおきな つばさが あって、たくさんの ひとを のせて とおくの くにまで とんでいくよ'] },
  { ans: 'にじ', emoji: '🌈', hints: ['そらで みられるよ', 'あめが やんで、おひさまが でたときに みえることが あるよ', 'なないろの おおきな はしのような かたちだよ'] },
  { ans: 'ゆき', emoji: '❄️', hints: ['ふゆに よく みられるよ', 'そらから ふってくるよ', 'しろくて つめたくて、ころがして だるまを つくったり、まるめて なげあって あそべるよ'] },
  { ans: 'はぶらし', emoji: '🪥', hints: ['まいにち つかう くらしの どうぐだよ', 'あさと よる、せんめんじょで つかうことが おおいよ', 'さきに けが たくさん ついていて、はを ごしごし みがくよ'] },
];
const ROUND = 5;
let order = [], used = 0, idx = 0, score = 0, shown = 1, q = null;

const $ = id => document.getElementById(id);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  if (used + ROUND > QUIZ.length) { order = shuffle(QUIZ); used = 0; }
  idx = 0; score = 0;
  $('end').classList.remove('show');
  $('play').style.display = '';
  $('qCount').style.display = '';
  $('qTotal').textContent = ROUND;
  show();
}
let tiles = [], filled = [], locked = false;
// こたえの文字＋まぎらわしい文字で、いつも8まいの ひらがなカード
function makeTiles() {
  const own = Array.from(q.ans);
  const pool = Array.from(new Set(QUIZ.filter(x => x.ans !== q.ans).flatMap(x => Array.from(x.ans)))).filter(c => !own.includes(c));
  return shuffle(own.concat(shuffle(pool).slice(0, 8 - own.length)));
}
function renderHints() {
  const H = $('hints'); H.textContent = '';
  q.hints.forEach((t, i) => {
    const r = document.createElement('div'); r.className = 'hrow' + (i < shown ? ' on' : '') + (i === shown - 1 && shown > 1 ? ' new' : '');
    const b = document.createElement('b'); b.textContent = 'ヒント' + (i + 1);
    const sp = document.createElement('span'); sp.textContent = t;
    r.appendChild(b); r.appendChild(sp); H.appendChild(r);
  });
  $('hintBtn').disabled = shown >= 3;
}
function show() {
  q = order[used + idx];
  locked = false;
  $('qNum').textContent = idx + 1;
  shown = 1; renderHints();
  const b = $('bubble'); b.className = 'bubble'; b.textContent = '';
  $('hintBtn').hidden = false; $('hintBtn').disabled = false;
  $('nextBtn').hidden = true;
  tiles = makeTiles(); filled = [];
  render();
}
function render() {
  $('delBtn').disabled = locked || filled.length === 0;
  const S = $('slots'); S.textContent = ''; S.className = 'slots';
  Array.from(q.ans).forEach((_, i) => {
    const d = document.createElement('button');
    d.type = 'button'; d.className = 'slot' + (filled[i] != null ? ' filled' : '');
    d.textContent = filled[i] != null ? tiles[filled[i]] : '';
    d.addEventListener('click', () => { if (!locked && filled[i] != null) { filled.splice(i, 1); render(); } });
    S.appendChild(d);
  });
  const C = $('choices'); C.textContent = '';
  tiles.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'choice' + (filled.includes(i) ? ' used' : '');
    btn.textContent = c; btn.disabled = locked || filled.includes(i);
    btn.addEventListener('click', () => pick(i));
    C.appendChild(btn);
  });
}
function pick(i) {
  if (locked || filled.length >= q.ans.length) return;
  Asobi.sfx('tap');
  filled.push(i); render();
  if (filled.length < q.ans.length) return;
  const word = filled.map(k => tiles[k]).join('');
  if (word === q.ans) correct(); else wrong();
}
function wrong() {
  locked = true;
  Asobi.sfx('ng');
  $('slots').classList.add('ng');
  setTimeout(() => { filled = []; locked = false; render(); }, 700);
}
function correct() {
  locked = true;
  Asobi.sfx('ok');
  const pts = 4 - shown; score += pts;
  render(); $('slots').classList.add('ok');
  $('hintBtn').hidden = true;
  const b = $('bubble'); b.className = 'bubble show good'; b.textContent = '';
  const em = document.createElement('span'); em.className = 'em'; em.textContent = q.emoji;
  b.appendChild(em);
  b.appendChild(document.createTextNode('せいかい！  ' + pts + 'てん  こたえは「' + q.ans + '」'));
  $('nextBtn').textContent = idx + 1 >= ROUND ? 'けっか' : 'つぎへ';
  $('nextBtn').hidden = false;
}
$('delBtn').addEventListener('click', () => { if (locked || !filled.length) return; filled.pop(); Asobi.sfx('tap'); render(); });
$('hintBtn').addEventListener('click', () => {
  if (locked || shown >= 3) return;
  shown++; Asobi.sfx('tap'); renderHints();
});
$('nextBtn').addEventListener('click', () => {
  if (idx + 1 >= ROUND) return finish();
  idx++; show();
});
function finish() {
  used += ROUND;
  $('play').style.display = 'none';
  $('nextBtn').hidden = true;
  $('qCount').style.display = 'none';
  $('endText').textContent = 'ぜんぶで ' + score + 'てん！（まんてん ' + ROUND * 3 + 'てん）';
  $('end').classList.add('show');
  Asobi.sfx('clear');
}
$('againBtn').addEventListener('click', start);
order = shuffle(QUIZ);
start();
</script>
</body>
</html>
