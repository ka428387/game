<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>もりのめいろ｜あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<link rel="stylesheet" href="common/maze.css">
<script src="common/asobi.js"></script>
<script src="common/maze.js"></script>
<style>
  :root {
    --mz-fg: #1d5a00;
    --mz-title-shadow: 0 2px 0 #fff, 0 0 10px rgba(255,255,255,0.9);
    --mz-btn-bg: #fff; --mz-btn-fg: #1d5a00; --mz-btn-edge: #4a8a20;
    --mz-on-bg: #1d5a00; --mz-on-fg: #fff;
    --mz-pad-bg: #fff; --mz-pad-fg: #2d6a10; --mz-pad-edge: #4a8a20;
    --mz-board-edge: #4a8a20;
    --mz-veil: rgba(29, 90, 0, 0.45);
    --mz-card-bg: #fffdf2; --mz-card-fg: #1d5a00; --mz-card-accent: #4a9a20;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #e6f2a8 url('images/bg/mori.jpg') center / cover no-repeat fixed;
    overflow-x: hidden;
  }
  .mz-board { background: #f5edd8; }
</style>
</head>
<body data-asobi="game">

<main class="mz" id="mz">
  <div class="mz-board"><canvas id="maze"></canvas></div>
</main>

<script>
// もりのめいろ：かべは線。リスが おうちを めざす
let N, CELL, maze, playerX, playerY, steps, trail, solution;
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');
const IMG = { player: MazeUI.img('images/chara/risu.png', () => draw()), goal: MazeUI.img('images/goal/ouchi.png', () => draw()) };

function newMaze(level) {
  N = MazeUI.SIZES[level];
  maze = generateMaze(N);
  solution = solve();
  playerX = 0; playerY = 0; steps = 0; trail = [];
  MazeUI.setSteps(0);
  fit();
}

// 画面に合わせた大きさで描き直す（くっきり描くため、画面の画素の細かさに合わせる）
function fit() {
  CELL = Math.floor(MazeUI.boardSize() / N);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CELL * N * dpr; canvas.height = CELL * N * dpr;
  canvas.style.width = CELL * N + 'px'; canvas.style.height = CELL * N + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function generateMaze(n) {
  const walls = [];
  for (let y = 0; y < n; y++) { walls[y] = []; for (let x = 0; x < n; x++) walls[y][x] = { right: true, down: true }; }
  const visited = Array.from({ length: n }, () => new Array(n).fill(false));
  const stack = [[0, 0]]; visited[0][0] = true;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx >= 0 && nx < n && ny >= 0 && ny < n && !visited[ny][nx];
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
    const nx = x + dx, ny = y + dy;
    if (dx === 1) walls[y][x].right = false;
    else if (dx === -1) walls[y][nx].right = false;
    else if (dy === 1) walls[y][x].down = false;
    else walls[ny][x].down = false;
    visited[ny][nx] = true;
    stack.push([nx, ny]);
  }
  return walls;
}

function canMove(x, y, dx, dy) {
  if (dx === 1)  return x < N - 1 && !maze[y][x].right;
  if (dx === -1) return x > 0     && !maze[y][x - 1].right;
  if (dy === 1)  return y < N - 1 && !maze[y][x].down;
  if (dy === -1) return y > 0     && !maze[y - 1][x].down;
  return false;
}

// ヒント用：スタートからゴールまでの道
function solve() {
  const prev = Array.from({ length: N }, () => new Array(N).fill(null));
  const q = [[0, 0]]; prev[0][0] = [-1, -1];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      if (!canMove(x, y, dx, dy)) continue;
      const nx = x + dx, ny = y + dy;
      if (prev[ny][nx]) continue;
      prev[ny][nx] = [x, y]; q.push([nx, ny]);
    }
  }
  const path = []; let c = [N - 1, N - 1];
  while (c[0] !== -1) { path.push(c); c = prev[c[1]][c[0]]; }
  return path;
}

function move(dx, dy) {
  if (!canMove(playerX, playerY, dx, dy)) { shake(); return false; }
  trail.push([playerX, playerY]);
  if (trail.length > 100) trail.shift();
  playerX += dx; playerY += dy;
  MazeUI.setSteps(++steps);
  draw();
  if (playerX === N - 1 && playerY === N - 1) MazeUI.win();
  return true;
}

function shake() {
  canvas.style.transition = 'transform 0.05s';
  canvas.style.transform = 'translateX(-5px)';
  setTimeout(() => { canvas.style.transform = 'translateX(5px)'; }, 60);
  setTimeout(() => { canvas.style.transform = 'translateX(0)'; }, 120);
}

function draw() {
  const S = CELL * N;
  ctx.fillStyle = '#f5edd8';
  ctx.fillRect(0, 0, S, S);

  if (MazeUI.hintOn()) {
    ctx.fillStyle = 'rgba(255, 200, 60, 0.45)';
    for (const [x, y] of solution) ctx.fillRect(x * CELL + 3, y * CELL + 3, CELL - 6, CELL - 6);
  }
  for (let i = 0; i < trail.length; i++) {
    const [tx, ty] = trail[i];
    ctx.fillStyle = `rgba(100,180,60,${(i / trail.length) * 0.3})`;
    ctx.fillRect(tx * CELL + 1, ty * CELL + 1, CELL - 2, CELL - 2);
  }

  ctx.fillStyle = '#ffe97a'; roundRect((N - 1) * CELL + 2, (N - 1) * CELL + 2, CELL - 4, CELL - 4, 6); ctx.fill();
  ctx.fillStyle = '#d4f0a0'; roundRect(2, 2, CELL - 4, CELL - 4, 6); ctx.fill();

  ctx.strokeStyle = '#4a8a20';
  ctx.lineWidth = Math.max(2, Math.min(3.5, CELL / 10));
  ctx.lineCap = 'round';
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const px = x * CELL, py = y * CELL;
      if (maze[y][x].right && x < N - 1) { ctx.beginPath(); ctx.moveTo(px + CELL, py); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
      if (maze[y][x].down && y < N - 1)  { ctx.beginPath(); ctx.moveTo(px, py + CELL); ctx.lineTo(px + CELL, py + CELL); ctx.stroke(); }
    }
  }

  MazeUI.drawImg(ctx, IMG.goal, (N - 1) * CELL + CELL / 2, (N - 1) * CELL + CELL / 2, CELL * 0.92);
  MazeUI.drawImg(ctx, IMG.player, playerX * CELL + CELL / 2, playerY * CELL + CELL / 2, CELL * 0.95);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

// もりの おんがく：ゆっくり さんぽする かんじ（ドレミソラだけ）
const music = MazeUI.makeMusic({
  bpm: 96, wave: 'triangle', vol: 0.12,
  melody: [[64,1],[67,1],[69,1],[67,1], [64,1],[62,1],[60,2], [64,1],[67,1],[69,1],[72,1], [69,1],[67,1],[64,2],
           [62,1],[64,1],[67,1],[64,1], [62,1],[60,1],[62,2], [64,1],[62,1],[60,1],[57,1], [60,4]],
  bass:   [[48,4],[43,4],[45,4],[43,4],[50,4],[43,4],[45,4],[48,4]],
});

MazeUI.mount({
  title: '🌲 もりのめいろ 🌲',
  onNew: newMaze,
  onMove: move,
  onHint: () => draw(),
  onResize: fit,
  music,
  clear: { img: 'images/chara/risu.png', text: 'おうちに ついたよ！' },
});
</script>
</body>
</html>
