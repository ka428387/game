<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<script src="common/asobi.js"></script>
<style>
  /* ホーム：アイコン・起動画面と同じ、クレヨンの絵本の世界 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #bfe3fb;
    overflow-x: hidden;
  }
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 64px;
  }

  .title-area { text-align: center; animation: fadeDown 0.6s ease both; }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  .globe {
    display: block; width: 104px; height: 104px; margin: 0 auto 10px;
    border-radius: 50%; border: 4px solid #fff;
    box-shadow: 0 6px 16px rgba(40, 90, 140, 0.25);
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  h1 {
    font-size: clamp(30px, 9vw, 46px); font-weight: 900; letter-spacing: 0.06em;
    color: #2b5d8a;
    text-shadow: 0 3px 0 #fff, 0 0 18px rgba(255, 255, 255, 0.9);
  }
  .subtitle { margin-top: 6px; font-size: 15px; font-weight: 700; color: #3f6f98; text-shadow: 0 1px 0 #fff; }

  .cards { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 440px; margin-top: 22px; }
  .section-label {
    align-self: flex-start;
    margin: 10px 0 -4px; padding: 4px 14px;
    border-radius: 999px; background: rgba(255, 255, 255, 0.85);
    font-size: 14px; font-weight: 900; color: #3f6f98;
  }

  /* カード：画用紙に、ゲームごとの色のふち */
  /* カード：2列。大きな絵・名前・年齢の札。ゲームごとの色のふち */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    --c: #7cbf5a; --c2: #e6f5da;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 8px 12px; text-decoration: none; text-align: center;
    border-radius: 24px; border: 3px solid var(--c);
    background: #fffdf6;
    box-shadow: 0 5px 0 var(--c), 0 10px 22px rgba(40, 70, 100, 0.12);
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeUp 0.5s ease both;
  }
  .card.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 14px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--c), 0 4px 10px rgba(40, 70, 100, 0.12); }
  .card-mori   { --c: #6fb24a; --c2: #e4f4d6; animation-delay: .05s; }
  .card-umi    { --c: #3d9be0; --c2: #dcefff; animation-delay: .1s; }
  .card-machi  { --c: #f08a2c; --c2: #fff0dc; animation-delay: .15s; }
  .card-space  { --c: #7a5cd6; --c2: #ece6ff; animation-delay: .2s; }
  .card-nakama { --c: #b763c7; --c2: #f6e4fa; animation-delay: .25s; }
  .card-rocket { --c: #3a6fd0; --c2: #e0eaff; animation-delay: .3s; }
  .card-neko   { --c: #e0884a; --c2: #fdeadb; animation-delay: .35s; }

  .card-icon {
    width: 92px; height: 92px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--c2);
    animation: iconFloat 3s ease-in-out infinite;
  }
  .card-icon img { width: 78px; height: 78px; display: block; }
  .wide .card-icon { width: 72px; height: 72px; }
  .wide .card-icon img { width: 60px; height: 60px; }
  @keyframes iconFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
  .card-umi .card-icon { animation-delay: -1s; } .card-machi .card-icon { animation-delay: -2s; }
  .card-space .card-icon { animation-delay: -.5s; } .card-rocket .card-icon { animation-delay: -1.5s; }
  .card-neko .card-icon { animation-delay: -2.5s; } .card-nakama .card-icon { animation-delay: -.8s; }
  .card-title { font-size: clamp(14px, 4.2vw, 19px); font-weight: 900; color: #3b3a4a; white-space: nowrap; }
  .level-tag { padding: 2px 10px; border-radius: 999px; background: var(--c2); color: var(--c); font-size: 12px; font-weight: 800; }
  .wide .text { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

  .footer {
    margin-top: 28px; padding: 6px 16px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.8);
    font-size: 13px; font-weight: 700; color: #4b7a3a;
  }
  body::before { background-image: url('images/sky.jpg'); } /* 背景の絵（common/asobi.css の固定の層） */
</style>
</head>
<body data-asobi="index">


<div class="content">
  <div class="title-area">
    <img class="globe" src="images/globe.jpg" alt="">
    <h1>あそびのせかい</h1>
    <p class="subtitle">すきなゲームをえらんでね！</p>
  </div>

  <div class="cards">
    <div class="section-label">🗺️ めいろ</div>
    <div class="grid">
      <a class="card card-mori" href="forest-maze.html">
        <span class="card-icon"><img src="images/chara/risu.png" alt=""></span>
        <span class="card-title">もりのめいろ</span>
        <span class="level-tag">3さい〜</span>
      </a>
      <a class="card card-umi" href="ocean-maze.html">
        <span class="card-icon"><img src="images/chara/sakana.png" alt=""></span>
        <span class="card-title">うみのめいろ</span>
        <span class="level-tag">3さい〜</span>
      </a>
      <a class="card card-machi" href="city-maze.html">
        <span class="card-icon"><img src="images/chara/kodomo.png" alt=""></span>
        <span class="card-title">まちのめいろ</span>
        <span class="level-tag">3さい〜</span>
      </a>
      <a class="card card-space" href="space-maze.html">
        <span class="card-icon"><img src="images/chara/roketto.png" alt=""></span>
        <span class="card-title">うちゅうのめいろ</span>
        <span class="level-tag">3さい〜</span>
      </a>
    </div>

    <div class="section-label">🎮 かず・なかまはずれ</div>
    <div class="grid">
      <a class="card card-nakama" href="nakamawake.html">
        <span class="card-icon"><img src="images/chara/mushimegane.png" alt=""></span>
        <span class="card-title">なかまはずれ</span>
        <span class="level-tag">3さい〜</span>
      </a>
      <a class="card card-rocket" href="kazu-rocket.html">
        <span class="card-icon"><img src="images/chara/kazu.png" alt=""></span>
        <span class="card-title">かずロケット</span>
        <span class="level-tag">4さい〜</span>
      </a>
      <a class="card card-neko wide" href="neko-math.html">
        <span class="card-icon"><img src="images/chara/neko.png" alt=""></span>
        <span class="text"><span class="card-title">ねこさんすうランド</span>
        <span class="level-tag">しょうがくせい</span></span>
      </a>
    </div>
  </div>

  <p class="footer">✨ もっとゲームがふえるよ！</p>
</div>

</body>
</html>
