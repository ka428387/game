<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>まちのめいろ｜あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<link rel="stylesheet" href="common/maze.css">
<script src="common/asobi.js"></script>
<script src="common/maze.js"></script>
<style>
  :root {
    --mz-fg: #431407;
    --mz-title-shadow: 0 2px 0 #fff, 0 0 10px rgba(255,255,255,0.9);
    --mz-btn-bg: #fff; --mz-btn-fg: #78350f; --mz-btn-edge: #f97316;
    --mz-on-bg: #f97316; --mz-on-fg: #fff;
    --mz-pad-bg: #fff; --mz-pad-fg: #c2410c; --mz-pad-edge: #f97316;
    --mz-board-edge: #78350f;
    --mz-veil: rgba(67,20,7,0.4);
    --mz-card-bg: #fffbeb; --mz-card-fg: #78350f; --mz-card-accent: #f97316;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #bfe6fb url('images/bg/machi.jpg') center / cover no-repeat fixed;
    overflow-x: hidden;
  }

  /* 下を走る車。絵文字は左向きなので、左右反転（scaleX(-1)）して右へ走らせる */
  @keyframes carMove {
    from { transform: translateX(-60px) scaleX(-1); }
    to { transform: translateX(110vw) scaleX(-1); }
  }
  .car { position: fixed; bottom: 14px; font-size: 22px; animation: carMove linear infinite; pointer-events: none; z-index: 1; }
</style>
</head>
<body data-asobi="game">


<main class="mz" id="mz">
  <div class="mz-board"><canvas id="maze"></canvas></div>
</main>

<script>
// まちのめいろ：かべは ブロック。ひとが ほしを めざす
let G, CELL, maze, visited, solution, px, py, steps;
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');
const IMG = { player: MazeUI.img('images/chara/kodomo.png', () => draw()), goal: MazeUI.img('images/goal/hata.png', () => draw()) };

function newMaze(level) {
  G = MazeUI.SIZES[level] * 2 + 1; // 部屋の数×2＋1 のブロック
  maze = generateMaze(G);
  solution = bfs(1, 1, G - 2, G - 2);
  px = 1; py = 1; steps = 0;
  visited = Array.from({ length: G }, () => ({}));
  visited[1][1] = true;
  MazeUI.setSteps(0);
  fit();
}

function fit() {
  CELL = Math.floor(MazeUI.boardSize() / G);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CELL * G * dpr; canvas.height = CELL * G * dpr;
  canvas.style.width = CELL * G + 'px'; canvas.style.height = CELL * G + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function generateMaze(g) {
  const grid = Array.from({ length: g }, () => Array(g).fill(1)); // 1=かべ
  const stack = [[1, 1]]; grid[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const opts = [[0,-2],[0,2],[-2,0],[2,0]].filter(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx > 0 && ny > 0 && nx < g - 1 && ny < g - 1 && grid[ny][nx] === 1;
    });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
    grid[y + dy / 2][x + dx / 2] = 0;
    grid[y + dy][x + dx] = 0;
    stack.push([x + dx, y + dy]);
  }
  return grid;
}

// ヒント用：スタートからゴールまでの道
function bfs(sx, sy, ex, ey) {
  const prev = Array.from({ length: G }, () => Array(G).fill(null));
  const q = [[sx, sy]]; prev[sy][sx] = [-1, -1];
  while (q.length) {
    const [x, y] = q.shift();
    if (x === ex && y === ey) break;
    for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      const nx = x + dx, ny = y + dy;
      if (maze[ny][nx] === 0 && !prev[ny][nx]) { prev[ny][nx] = [x, y]; q.push([nx, ny]); }
    }
  }
  const path = []; let c = [ex, ey];
  while (c[0] !== -1) { path.push(c); c = prev[c[1]][c[0]]; }
  return path;
}

function move(dx, dy) {
  const nx = px + dx, ny = py + dy;
  if (maze[ny][nx] === 1) return false;
  px = nx; py = ny;
  visited[py][px] = true;
  MazeUI.setSteps(++steps);
  draw();
  if (px === G - 2 && py === G - 2) MazeUI.win();
  return true;
}

const COLORS = {
  floor: '#fff8e7', floorAlt: '#fef3c7',
  wall: '#c2a251', wallTop: '#e8c86a',
  trail: 'rgba(251,191,36,0.5)', trailBorder: 'rgba(245,158,11,0.8)',
  hint: 'rgba(253,120,60,0.35)',
};

function draw() {
  const hint = MazeUI.hintOn() ? new Set(solution.map(([x, y]) => x + ',' + y)) : null;
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
    const cx = x * CELL, cy = y * CELL;
    if (maze[y][x] === 1) {
      ctx.fillStyle = COLORS.wall; ctx.fillRect(cx, cy, CELL, CELL);
      ctx.fillStyle = COLORS.wallTop; ctx.fillRect(cx, cy, CELL, 3); ctx.fillRect(cx, cy, 3, CELL);
      if ((y + Math.floor(x / 2)) % 2 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(cx + 1, cy + 1, CELL - 2, CELL - 2); }
    } else {
      ctx.fillStyle = (x + y) % 2 === 0 ? COLORS.floor : COLORS.floorAlt;
      ctx.fillRect(cx, cy, CELL, CELL);
      if (hint && hint.has(x + ',' + y)) { ctx.fillStyle = COLORS.hint; ctx.fillRect(cx + 1, cy + 1, CELL - 2, CELL - 2); }
      if (visited[y][x]) {
        ctx.fillStyle = COLORS.trail; ctx.fillRect(cx + 2, cy + 2, CELL - 4, CELL - 4);
        ctx.strokeStyle = COLORS.trailBorder; ctx.lineWidth = 1; ctx.strokeRect(cx + 2.5, cy + 2.5, CELL - 5, CELL - 5);
      }
    }
  }
  // ゴールの旗・さんぽする子ども（ブロック1つより少し大きく描く）
  MazeUI.drawImg(ctx, IMG.goal, (G - 2) * CELL + CELL / 2, (G - 2) * CELL + CELL / 2, CELL * 1.25);
  MazeUI.drawImg(ctx, IMG.player, px * CELL + CELL / 2, py * CELL + CELL / 2, CELL * 1.3);
}

// ======== まちの おんがく：あかるい ポップ ========
let audioCtx = null, musicNodes = [];
function startMusic() {
  if (!audioCtx) audioCtx = new window.AudioContext();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopMusic();
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.18, audioCtx.currentTime);
  master.connect(audioCtx.destination);
  musicNodes.push({ stop: () => master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05) });

  const melody = [[523.25,0.6],[659.25,0.6],[783.99,0.6],[659.25,0.6],[587.33,0.6],[523.25,0.6],[659.25,0.6],[783.99,1.2],
                  [880.00,0.6],[783.99,0.6],[698.46,0.6],[659.25,0.6],[587.33,0.6],[523.25,1.2]];
  const melodyLen = melody.reduce((a, [, d]) => a + d, 0);
  function playMelody() {
    let t = audioCtx.currentTime + 0.05;
    for (const [freq, dur] of melody) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.7, t + 0.04);
      g.gain.setValueAtTime(0.7, t + dur - 0.08); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
      t += dur;
    }
  }
  const chords = [[261.63,392.00,1.2],[293.66,440.00,1.2],[261.63,392.00,1.2],[246.94,369.99,1.2]];
  const chordLen = chords.reduce((a, [, , d]) => a + d, 0);
  function playChords() {
    let t = audioCtx.currentTime + 0.05;
    for (const [f1, f2, dur] of chords) {
      for (const freq of [f1, f2]) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0, t + dur);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
      }
      t += dur;
    }
  }
  function playRhythm() {
    const now = audioCtx.currentTime;
    for (const b of [0, 0.4, 0.8, 1.2]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(b % 0.8 === 0 ? 180 : 120, now + b);
      g.gain.setValueAtTime(0.08, now + b); g.gain.linearRampToValueAtTime(0, now + b + 0.15);
      o.connect(g); g.connect(master); o.start(now + b); o.stop(now + b + 0.2);
    }
  }
  playMelody(); playChords(); playRhythm();
  const ids = [setInterval(playMelody, melodyLen * 1000), setInterval(playChords, chordLen * 1000), setInterval(playRhythm, 1600)];
  musicNodes.push({ stop: () => ids.forEach(clearInterval) });
}
function stopMusic() {
  musicNodes.forEach(n => { try { n.stop(); } catch (e) {} });
  musicNodes = [];
}

// 下を走る車
const cars = ['🚗','🚕','🚙','🚌','🛻'];
for (let i = 0; i < 3; i++) {
  const c = document.createElement('div');
  c.className = 'car';
  c.textContent = cars[Math.floor(Math.random() * cars.length)];
  const dur = 12 + Math.random() * 20;
  c.style.cssText = `font-size:${18 + Math.random() * 10}px;bottom:${8 + Math.random() * 20}px;animation-duration:${dur}s;animation-delay:${-Math.random() * dur}s;`;
  document.body.appendChild(c);
}

MazeUI.mount({
  title: '🏙️ まちのめいろ 🏙️',
  onNew: newMaze,
  onMove: move,
  onHint: () => draw(),
  onResize: fit,
  music: { start: startMusic, stop: stopMusic },
  clear: { img: 'images/chara/kodomo.png', text: 'ぶじに まちを あるききったよ！' },
});
</script>
</body>
</html>
