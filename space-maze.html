<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>うちゅうのめいろ｜あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<link rel="stylesheet" href="common/maze.css">
<script src="common/asobi.js"></script>
<script src="common/maze.js"></script>
<style>
  :root {
    --mz-fg: #eaf2ff;
    --mz-title-shadow: 0 0 14px rgba(110,231,255,.55);
    --mz-btn-bg: #2a1a5e; --mz-btn-fg: #eaf2ff; --mz-btn-edge: #6b46e0;
    --mz-on-bg: #6b46e0; --mz-on-fg: #fff;
    --mz-pad-bg: #2a1a5e; --mz-pad-fg: #6ee7ff; --mz-pad-edge: #6b46e0;
    --mz-board-edge: #6b46e0;
    --mz-veil: rgba(7,7,31,0.7);
    --mz-card-bg: #2a1a5e; --mz-card-fg: #eaf2ff; --mz-card-accent: #ffd54f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #36256e 0%, transparent 60%),
      linear-gradient(180deg, #0b0b2b 0%, #1b1147 50%, #2a1a5e 100%);
    overflow-x: hidden;
  }
  .mz-board { box-shadow: 0 0 26px rgba(107,70,224,.5); background: #07071f; }
  .mz-info span:last-child:not(:first-child) { color: #ffd54f; }
</style>
</head>
<body data-asobi="game">

<main class="mz" id="mz">
  <div class="mz-board"><canvas id="cv"></canvas></div>
</main>

<script>
// うちゅうのめいろ：かべは ブロック。ロケットが ⭐を あつめながら わくせいを めざす
(function () {
  "use strict";
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');

  const STARS = [3, 5, 7]; // むずかしさごとの ⭐の数
  let CELLS = 6, STAR_COUNT = 3, R = 0;
  let grid = [], starSet = new Set(), solution = new Set();
  let goal = { r: 0, c: 0 }, player = { r: 1, c: 1 }, disp = { x: 1, y: 1 };
  let animating = false, animFrom = null, animTo = null, animStart = 0;
  const animDur = 90;
  let pendingDir = null;
  let steps = 0, starsGot = 0, won = false;
  let particles = [], confetti = [];
  const bgStars = [];
  for (let i = 0; i < 90; i++) bgStars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + 0.5, ph: Math.random() * Math.PI * 2, sp: Math.random() * 2 + 1 });

  function genMaze() {
    R = CELLS * 2 + 1;
    grid = Array.from({ length: R }, () => new Array(R).fill(1));
    const visited = Array.from({ length: CELLS }, () => new Array(CELLS).fill(false));
    const stack = [[0, 0]];
    visited[0][0] = true; grid[1][1] = 0;
    while (stack.length) {
      const [cy, cx] = stack[stack.length - 1];
      const opts = [];
      for (const [dy, dx] of [[0,-1],[0,1],[-1,0],[1,0]]) {
        const ny = cy + dy, nx = cx + dx;
        if (ny >= 0 && ny < CELLS && nx >= 0 && nx < CELLS && !visited[ny][nx]) opts.push([ny, nx, dy, dx]);
      }
      if (!opts.length) { stack.pop(); continue; }
      const [ny, nx, dy, dx] = opts[(Math.random() * opts.length) | 0];
      visited[ny][nx] = true;
      grid[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0;
      grid[ny * 2 + 1][nx * 2 + 1] = 0;
      stack.push([ny, nx]);
    }
    player = { r: 1, c: 1 };
    goal = { r: R - 2, c: R - 2 };
    placeStars();
    solve();
  }

  // ⭐は いきどまりに おく
  function placeStars() {
    starSet = new Set();
    const deadEnds = [], paths = [];
    for (let r = 1; r < R; r += 2) for (let c = 1; c < R; c += 2) {
      if (grid[r][c] !== 0) continue;
      if ((r === 1 && c === 1) || (r === goal.r && c === goal.c)) continue;
      let open = 0;
      if (grid[r - 1][c] === 0) open++;
      if (grid[r + 1][c] === 0) open++;
      if (grid[r][c - 1] === 0) open++;
      if (grid[r][c + 1] === 0) open++;
      paths.push([r, c]);
      if (open === 1) deadEnds.push([r, c]);
    }
    const pool = deadEnds.length >= STAR_COUNT ? deadEnds.slice() : deadEnds.concat(paths);
    for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
    for (const [r, c] of pool) {
      starSet.add(r + ',' + c);
      if (starSet.size >= STAR_COUNT) break;
    }
  }

  // ヒント用：スタートからゴールまでの道
  function solve() {
    const prev = Array.from({ length: R }, () => new Array(R).fill(null));
    const q = [[1, 1]]; prev[1][1] = [-1, -1];
    while (q.length) {
      const [r, c] = q.shift();
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = r + dr, nc = c + dc;
        if (grid[nr][nc] === 0 && !prev[nr][nc]) { prev[nr][nc] = [r, c]; q.push([nr, nc]); }
      }
    }
    solution = new Set(); let p = [goal.r, goal.c];
    while (p[0] !== -1) { solution.add(p[0] + ',' + p[1]); p = prev[p[0]][p[1]]; }
  }

  let size = 0, cell = 0;
  function fit() {
    size = MazeUI.boardSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / R;
  }

  function starText() { return '⭐ ほし：' + starsGot + '/' + STAR_COUNT; }

  function tryMove(dx, dy) {
    if (won) return false;
    if (animating) { pendingDir = [dx, dy]; return false; }
    const nr = player.r + dy, nc = player.c + dx;
    if (grid[nr][nc] !== 0) return false;
    animFrom = { x: player.c, y: player.r };
    player.r = nr; player.c = nc;
    animTo = { x: player.c, y: player.r };
    animating = true; animStart = performance.now();
    MazeUI.setSteps(++steps);
    for (let i = 0; i < 5; i++) {
      particles.push({ x: disp.x, y: disp.y, vx: -dx * 0.04 + (Math.random() - .5) * 0.03, vy: -dy * 0.04 + (Math.random() - .5) * 0.03, life: 1, gold: false });
    }
    return true;
  }
  function afterMove() {
    const key = player.r + ',' + player.c;
    if (starSet.has(key)) {
      starSet.delete(key); starsGot++;
      MazeUI.setExtra(starText());
      Asobi.sfx('ok');
      burst(player.c, player.r);
    }
    if (player.r === goal.r && player.c === goal.c) { doWin(); return; }
    if (pendingDir) { const d = pendingDir; pendingDir = null; tryMove(d[0], d[1]); }
  }

  function burst(c, r) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 0.05 + 0.02;
      particles.push({ x: c, y: r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, gold: true });
    }
  }
  function doWin() {
    won = true;
    const all = starsGot === STAR_COUNT;
    MazeUI.win({ extra: '⭐ あつめたほし：' + starsGot + '/' + STAR_COUNT + (all ? '　ぜんぶ！すごい！' : '') });
    const ico = ['⭐','✨','🌟','🚀','🪐','💫'];
    confetti = [];
    for (let i = 0; i < 40; i++) {
      confetti.push({ x: Math.random(), y: -Math.random() * 0.4, vy: 0.004 + Math.random() * 0.006, vx: (Math.random() - .5) * 0.004, em: ico[(Math.random() * ico.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * 0.2, s: Math.random() * 10 + 16 });
    }
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // うしろにふわっとした光の円（影ぼかしは使わない＝iOSの絵文字色バグ回避）
  function halo(cx, cy, r, rgb, alpha) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + alpha + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
  // 絵文字を必ず本来の色で描く（影ぼかしOFF・塗り色リセット）
  function glyph(em, cx, cy, fpx) {
    ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
    ctx.font = fpx + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(em, cx, cy);
  }

  function draw(t) {
    const w = size, h = size;
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0b0b2b'); g.addColorStop(1, '#241654');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    for (const st of bgStars) {
      ctx.globalAlpha = Math.max(0.05, 0.35 + 0.45 * Math.sin(t * 0.001 * st.sp + st.ph));
      ctx.fillStyle = '#cfe6ff';
      ctx.beginPath(); ctx.arc(st.x * w, st.y * h, st.s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    const hint = MazeUI.hintOn();
    for (let r = 0; r < R; r++) for (let c = 0; c < R; c++) {
      const x = c * cell, y = r * cell;
      if (grid[r][c] === 1) {
        const wg = ctx.createLinearGradient(x, y, x + cell, y + cell);
        wg.addColorStop(0, '#3b2a8c'); wg.addColorStop(1, '#6b46e0');
        ctx.fillStyle = wg;
        rrect(x + 0.5, y + 0.5, cell - 1, cell - 1, Math.min(5, cell * 0.22)); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(7,7,31,0.45)';
        ctx.fillRect(x, y, cell + 0.5, cell + 0.5);
        if (hint && solution.has(r + ',' + c)) {
          ctx.fillStyle = 'rgba(110,231,255,0.28)';
          ctx.fillRect(x + cell * 0.15, y + cell * 0.15, cell * 0.7, cell * 0.7);
        }
      }
    }

    const pulse = 0.5 + 0.5 * Math.sin(t * 0.005);
    starSet.forEach(function (k) {
      const [r, c] = k.split(',').map(Number);
      const cx = c * cell + cell / 2, cy = r * cell + cell / 2;
      ctx.save();
      halo(cx, cy, cell * (0.55 + 0.12 * pulse), '255,213,79', 0.55);
      glyph('⭐', cx, cy + cell * 0.04, Math.floor(cell * 0.78));
      ctx.restore();
    });

    {
      const gx = goal.c * cell + cell / 2, gy = goal.r * cell + cell / 2;
      const open = starsGot >= STAR_COUNT;
      ctx.save();
      halo(gx, gy, cell * (0.7 + 0.15 * pulse), open ? '110,255,166' : '110,231,255', 0.6);
      glyph('🪐', gx, gy + cell * 0.04, Math.floor(cell * 0.88));
      ctx.restore();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.05;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.gold ? '#ffd54f' : '#9bf0ff';
      ctx.beginPath(); ctx.arc(p.x * cell + cell / 2, p.y * cell + cell / 2, cell * 0.12 * p.life + 1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (animating) {
      const k = Math.min(1, (t - animStart) / animDur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      disp.x = animFrom.x + (animTo.x - animFrom.x) * e;
      disp.y = animFrom.y + (animTo.y - animFrom.y) * e;
      if (k >= 1) { animating = false; disp.x = animTo.x; disp.y = animTo.y; afterMove(); }
    } else if (!won) {
      disp.x = player.c; disp.y = player.r;
    }
    {
      const px = disp.x * cell + cell / 2, py = disp.y * cell + cell / 2;
      ctx.save();
      halo(px, py, cell * 0.62, '110,231,255', 0.5);
      glyph('🚀', px, py + cell * 0.04, Math.floor(cell * 0.86));
      ctx.restore();
    }

    if (won && confetti.length) {
      for (const cf of confetti) {
        cf.x += cf.vx; cf.y += cf.vy; cf.rot += cf.vr;
        if (cf.y > 1.15) cf.y = -0.1;
        ctx.save();
        ctx.translate(cf.x * w, cf.y * h); ctx.rotate(cf.rot);
        ctx.font = cf.s + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cf.em, 0, 0);
        ctx.restore();
      }
    }
    requestAnimationFrame(draw);
  }

  function newGame(level) {
    CELLS = MazeUI.SIZES[level];
    STAR_COUNT = STARS[level];
    steps = 0; starsGot = 0; won = false; particles = []; confetti = []; pendingDir = null; animating = false;
    genMaze();
    disp.x = player.c; disp.y = player.r;
    MazeUI.setSteps(0);
    MazeUI.setExtra(starText());
    fit();
  }

  // うちゅうの おんがく：ふわふわ ただよう アルペジオ
  const music = MazeUI.makeMusic({
    bpm: 76, wave: 'sine', vol: 0.11,
    melody: [[57,.5],[60,.5],[64,.5],[60,.5],[57,.5],[60,.5],[64,.5],[69,.5],
             [53,.5],[57,.5],[60,.5],[57,.5],[53,.5],[57,.5],[60,.5],[65,.5],
             [48,.5],[52,.5],[55,.5],[52,.5],[48,.5],[52,.5],[55,.5],[60,.5],
             [55,.5],[59,.5],[62,.5],[59,.5],[55,.5],[59,.5],[62,.5],[67,.5]],
    bass: [[45,4],[41,4],[48,4],[43,4]],
  });

  MazeUI.mount({
    title: '🚀 うちゅうのめいろ 🚀',
    onNew: newGame,
    onMove: tryMove,
    onHint: () => {},           // まいかい描き直しているので、すぐ反映される
    onResize: fit,
    music,
    clear: { emoji: '🚀', text: 'わくせいに とうちゃく！' },
  });
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
