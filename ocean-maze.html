<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>うみのめいろ｜あそびのせかい</title>
<link rel="stylesheet" href="common/asobi.css">
<link rel="stylesheet" href="common/maze.css">
<script src="common/asobi.js"></script>
<script src="common/maze.js"></script>
<style>
  :root {
    --mz-fg: #7ee8ff;
    --mz-title-shadow: 0 0 14px rgba(100,220,255,0.7);
    --mz-btn-bg: #0d2a48; --mz-btn-fg: #7ee8ff; --mz-btn-edge: #1a6fa8;
    --mz-on-bg: #1a7aad; --mz-on-fg: #fff;
    --mz-pad-bg: #0d2a48; --mz-pad-fg: #7ee8ff; --mz-pad-edge: #1a6fa8;
    --mz-board-edge: #1a6fa8;
    --mz-veil: rgba(2,12,27,0.75);
    --mz-card-bg: #0d2a48; --mz-card-fg: #cdefff; --mz-card-accent: #ffd166;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #020c1b;
    overflow-x: hidden;
  }
  /* 海の背景 */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(13,93,155,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,120,160,0.2) 0%, transparent 50%),
      linear-gradient(180deg, #020c1b 0%, #041829 40%, #062035 100%);
  }
  .bubble {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 1;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6), rgba(100,220,255,0.1));
    border: 1px solid rgba(150,230,255,0.3);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(100vh) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(-100px) translateX(30px) scale(0.8); opacity: 0; }
  }
  .mz-board { box-shadow: 0 0 30px rgba(0,100,180,0.4); }
</style>
</head>
<body data-asobi="game">

<main class="mz" id="mz">
  <div class="mz-board"><canvas id="maze"></canvas></div>
</main>

<script>
// うみのめいろ：かべは光る線。さかなが ほしを めざす
let N, CELL, grid, playerX, playerY, steps, visited, solved;
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');

function newMaze(level) {
  N = MazeUI.SIZES[level];
  generateMaze();
  solveMaze();
  playerX = 0; playerY = 0; steps = 0;
  visited = Array.from({ length: N }, () => Array(N).fill(false));
  visited[0][0] = true;
  MazeUI.setSteps(0);
  fit();
}

function fit() {
  CELL = Math.floor(MazeUI.boardSize() / N);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CELL * N * dpr; canvas.height = CELL * N * dpr;
  canvas.style.width = CELL * N + 'px'; canvas.style.height = CELL * N + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMaze();
}

function generateMaze() {
  grid = Array.from({ length: N }, () => Array.from({ length: N }, () => ({ r: true, b: true })));
  const inMaze = Array.from({ length: N }, () => Array(N).fill(false));
  inMaze[0][0] = true;
  const stack = [[0, 0]];
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const nb = [];
    for (const [dx, dy] of [[1,0],[0,1],[-1,0],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < N && ny >= 0 && ny < N && !inMaze[ny][nx]) nb.push([nx, ny, dx, dy]);
    }
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(Math.random() * nb.length)];
    if (dx === 1) grid[cy][cx].r = false;
    else if (dx === -1) grid[ny][nx].r = false;
    else if (dy === 1) grid[cy][cx].b = false;
    else grid[ny][nx].b = false;
    inMaze[ny][nx] = true;
    stack.push([nx, ny]);
  }
}

function open(x, y, dx, dy) {
  const nx = x + dx, ny = y + dy;
  if (nx < 0 || nx >= N || ny < 0 || ny >= N) return false;
  if (dx === 1)  return !grid[y][x].r;
  if (dx === -1) return !grid[ny][nx].r;
  if (dy === 1)  return !grid[y][x].b;
  return !grid[ny][nx].b;
}

// ヒント用：スタートからゴールまでの道
function solveMaze() {
  const prev = Array.from({ length: N }, () => Array(N).fill(null));
  const q = [[0, 0]]; prev[0][0] = [-1, -1];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [dx, dy] of [[1,0],[0,1],[-1,0],[0,-1]]) {
      if (!open(x, y, dx, dy) || prev[y + dy][x + dx]) continue;
      prev[y + dy][x + dx] = [x, y]; q.push([x + dx, y + dy]);
    }
  }
  solved = []; let c = [N - 1, N - 1];
  while (c[0] !== -1) { solved.push(c); c = prev[c[1]][c[0]]; }
}

function move(dx, dy) {
  if (!open(playerX, playerY, dx, dy)) return false;
  playerX += dx; playerY += dy;
  visited[playerY][playerX] = true;
  MazeUI.setSteps(++steps);
  drawMaze();
  if (playerX === N - 1 && playerY === N - 1) MazeUI.win();
  return true;
}

function drawMaze() {
  const W = N * CELL;
  const bg = ctx.createLinearGradient(0, 0, 0, W);
  bg.addColorStop(0, '#041525'); bg.addColorStop(1, '#062035');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, W);

  // うすい海底のます目
  ctx.strokeStyle = 'rgba(30,80,120,0.3)'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, W); ctx.stroke();
  }

  if (MazeUI.hintOn()) {
    ctx.fillStyle = 'rgba(255,220,80,0.3)';
    for (const [hx, hy] of solved) ctx.fillRect(hx * CELL + 3, hy * CELL + 3, CELL - 6, CELL - 6);
  }

  // 通った道（光る）
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!visited[y][x]) continue;
    const g = ctx.createRadialGradient(x * CELL + CELL / 2, y * CELL + CELL / 2, 0, x * CELL + CELL / 2, y * CELL + CELL / 2, CELL * 0.7);
    g.addColorStop(0, 'rgba(80,200,255,0.28)'); g.addColorStop(1, 'rgba(30,120,200,0.05)');
    ctx.fillStyle = g; ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  }

  drawCell(0, 0, 'rgba(100,255,150,0.25)', '🐬');
  drawCell(N - 1, N - 1, 'rgba(255,180,50,0.3)', '⭐');

  // かべ（光る線）
  ctx.save();
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(80,180,255,0.7)'; ctx.shadowBlur = 6;
  ctx.strokeStyle = '#3aa0e0'; ctx.lineWidth = Math.max(2, Math.min(3.5, CELL / 10));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const cx = x * CELL, cy = y * CELL;
    if (grid[y][x].r && x < N - 1) { ctx.beginPath(); ctx.moveTo(cx + CELL, cy); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke(); }
    if (grid[y][x].b && y < N - 1) { ctx.beginPath(); ctx.moveTo(cx, cy + CELL); ctx.lineTo(cx + CELL, cy + CELL); ctx.stroke(); }
  }
  ctx.restore();

  // さかな
  const px = playerX * CELL + CELL / 2, py = playerY * CELL + CELL / 2;
  const glow = ctx.createRadialGradient(px, py, 0, px, py, CELL * 0.8);
  glow.addColorStop(0, 'rgba(100,220,255,0.5)'); glow.addColorStop(1, 'rgba(0,100,200,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px, py, CELL * 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.font = `${Math.floor(CELL * 0.62)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🐠', px, py);
}

function drawCell(x, y, color, emoji) {
  ctx.fillStyle = color;
  ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
  ctx.font = `${Math.floor(CELL * 0.55)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, x * CELL + CELL / 2, y * CELL + CELL / 2);
}

// ======== うみの おんがく：ゆっくりした和音と、波の音 ========
let audioCtx = null, musicPlaying = false, musicTimer = null, musicMasters = [];
function playOceanChunk(startTime) {
  if (!musicPlaying) return;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.18, startTime);
  master.connect(audioCtx.destination);
  musicMasters.push(master);
  const chordDuration = 3.2;
  const chords = [
    [146.83, 174.61, 220.00, 261.63],
    [110.00, 146.83, 174.61, 220.00],
    [98.00,  123.47, 146.83, 196.00],
    [130.81, 164.81, 196.00, 246.94],
  ];
  const total = chords.length * chordDuration;
  chords.forEach((chord, ci) => {
    const t = startTime + ci * chordDuration;
    chord.forEach((freq, fi) => {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq / 2, t);
      osc.detune.setValueAtTime(fi % 2 === 0 ? 3 : -3, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.3);
      g.gain.setValueAtTime(0.10, t + chordDuration - 0.5);
      g.gain.linearRampToValueAtTime(0, t + chordDuration);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + chordDuration);
    });
  });
  // 波の音
  const size = audioCtx.sampleRate * total;
  const buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * 0.02;
  const noise = audioCtx.createBufferSource(); noise.buffer = buf;
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
  const ng = audioCtx.createGain(); ng.gain.value = 0.08;
  noise.connect(lp); lp.connect(ng); ng.connect(master);
  noise.start(startTime); noise.stop(startTime + total);
  // ときどき 水の きらきら
  for (let i = 0; i < 6; i++) {
    const t = startTime + Math.random() * total;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(800 + Math.random() * 400, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 0.05); g.gain.linearRampToValueAtTime(0, t + 0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
  }
  musicTimer = setTimeout(() => playOceanChunk(startTime + total), (startTime + total - audioCtx.currentTime) * 1000 - 300);
}
const music = {
  start() {
    if (!audioCtx) audioCtx = new window.AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    musicPlaying = true;
    playOceanChunk(audioCtx.currentTime + 0.05);
  },
  stop() {
    musicPlaying = false; clearTimeout(musicTimer);
    // もう鳴らす予定の音も、すぐ小さくして消す
    musicMasters.forEach(m => m.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1));
    musicMasters = [];
  },
};

// あわ
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div');
  b.className = 'bubble';
  const s = 4 + Math.random() * 12;
  b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;bottom:-${s}px;animation-duration:${6 + Math.random() * 10}s;animation-delay:${Math.random() * 8}s;`;
  document.body.appendChild(b);
}

MazeUI.mount({
  title: '🌊 うみのめいろ 🌊',
  onNew: newMaze,
  onMove: move,
  onHint: () => drawMaze(),
  onResize: fit,
  music,
  clear: { emoji: '🐠', text: 'しんかいの なぞを といたよ！' },
});
</script>
</body>
</html>
